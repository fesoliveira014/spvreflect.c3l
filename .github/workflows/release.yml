name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  C3C_VERSION: '0.8.3'
  PROVIDES: spvreflect

jobs:
  windows-library:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Reflect
          ref: vulkan-sdk-1.4.341.0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build static library
        shell: bash
        run: |
          mkdir -p out/windows
          cl /nologo /c /O2 /MT /DNDEBUG spirv_reflect.c
          lib /nologo /OUT:out/windows/spvreflect.lib spirv_reflect.obj
      - uses: actions/upload-artifact@v4
        with:
          name: windows-library
          path: out
          if-no-files-found: error

  package:
    needs: windows-library
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-library
          path: .
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Pack per-platform artifacts
        run: |
          mkdir -p dist
          pack() {
            local platform="$1" natives="$2"
            {
              find . -maxdepth 1 -type f \( -name manifest.json -o -name 'LICENSE*' -o -name 'NOTICE*' \
                -o -name README.md -o -name '*.c3' -o -name '*.c3i' \)
              if [[ -n "$natives" && -d "$natives" ]]; then find "$natives" -type f; fi
            } | sed 's|^\./||' | LC_ALL=C sort \
              | zip -X -q "dist/${PROVIDES}-v${VERSION}-${platform}.c3l" -@
          }
          pack linux-x64 linux
          pack windows-x64 windows
          (cd dist && sha256sum ./*.c3l | sed 's|\./||' > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Install c3c (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.tar.gz" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux-static.tar.gz"
          tar -xzf "$RUNNER_TEMP/c3.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Install c3c (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.zip" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
          unzip -q "$RUNNER_TEMP/c3.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Compile unpacked sources
        run: |
          mkdir unpacked
          unzip -q dist/*-${{ matrix.target }}.c3l -d unpacked
          unzip -l dist/*-${{ matrix.target }}.c3l
          test -f unpacked/manifest.json
          c3c compile-only --no-obj unpacked/spvreflect.c3
      - name: Link and run against the packed library
        run: |
          mkdir -p build/consumer
          cp dist/*-${{ matrix.target }}.c3l build/consumer/
          cd build
          c3c compile ../test/smoke.c3 --libdir consumer --lib spvreflect --warn-deprecation=error -o smoke
          if [[ "$RUNNER_OS" == Windows ]]; then ./smoke.exe; else ./smoke; fi
      - name: Check glibc symbols (Linux)
        if: runner.os == 'Linux'
        run: |
          ! nm -u unpacked/linux/libspvreflect.a | grep -E '__isoc23_|strlcpy'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.c3l ./SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
